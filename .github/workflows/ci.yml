name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting, lints and tests
        run: make check

  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            executable: iron-tide
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            executable: iron-tide
            dmg: true
          # Intel Macs: cross-compiled on the Apple Silicon runner.
          - os: macos-latest
            platform: macos-x86_64
            target: x86_64-apple-darwin
            executable: iron-tide
            dmg: true
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            executable: iron-tide.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      BINARY: target/${{ matrix.target }}/release/${{ matrix.executable }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Bevy system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Build the game
        run: cargo build --release --bin iron-tide --target ${{ matrix.target }}

      - name: Bundle binary and assets
        run: tools/package.sh ${{ matrix.platform }} "$BINARY"

      - name: Build the macOS disk image
        if: matrix.dmg
        run: tools/package_dmg.sh ${{ matrix.platform }} "$BINARY"

      - uses: actions/upload-artifact@v4
        with:
          name: iron-tide-${{ matrix.platform }}
          path: dist/iron-tide-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
