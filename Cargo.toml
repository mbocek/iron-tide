[package]
name = "iron_tide"
default-run = "iron-tide"
version = "1.2.0"
edition = "2024"
rust-version = "1.100"
description = "Iron Tide - an original real-time strategy game (c) 2026"
repository = "https://github.com/mbocek/iron-tide"

[[bin]]
name = "iron-tide"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.20.1", features = ["jpeg"] }
libm = "0.2"
pathfinding = "4.16"
rand = "0.10.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
